<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg" width="400" height="700" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe — Page 1 : Accueil / Connexion</title>
  <desc>Page d'accueil avec hero et formulaire de connexion</desc>

  <!-- Background -->
  <rect width="400" height="700" fill="#F8F8F6"/>

  <!-- Device frame -->
  <rect x="20" y="20" width="360" height="660" rx="12" fill="white" stroke="#CCCCCC" stroke-width="1.5"/>

  <!-- Topbar -->
  <rect x="20" y="20" width="360" height="44" rx="12" fill="#F1EFE8"/>
  <rect x="20" y="52" width="360" height="12" fill="#F1EFE8"/>
  <rect x="36" y="34" width="80" height="12" rx="3" fill="#AAAAAA"/>

  <!-- Hero zone -->
  <rect x="36" y="80" width="328" height="180" rx="10" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="4,3"/>
  <!-- Avatar -->
  <circle cx="200" cy="126" r="26" fill="#CCCCCC"/>
  <!-- H1 -->
  <rect x="110" y="160" width="180" height="13" rx="3" fill="#888"/>
  <!-- H2 -->
  <rect x="76" y="181" width="248" height="9" rx="3" fill="#CCCCCC"/>
  <!-- Slogan text -->
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="#999">Slogan / description courte de l'application</text>

  <!-- Section label -->
  <text x="36" y="286" font-size="10" fill="#999" letter-spacing="1">CONNEXION</text>

  <!-- Form card -->
  <rect x="60" y="296" width="280" height="300" rx="10" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Email label + input -->
  <rect x="76" y="314" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="76" y="328" width="248" height="32" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Password label + input -->
  <rect x="76" y="370" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="76" y="384" width="248" height="32" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Submit button -->
  <rect x="76" y="428" width="248" height="36" rx="6" fill="#555"/>
  <rect x="140" y="442" width="120" height="10" rx="2" fill="white"/>
  <text x="200" y="476" text-anchor="middle" font-size="9" fill="#999">Se connecter</text>

  <!-- OR divider -->
  <line x1="100" y1="494" x2="168" y2="494" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="200" y="497" text-anchor="middle" font-size="10" fill="#BBBBBB">ou</text>
  <line x1="232" y1="494" x2="300" y2="494" stroke="#CCCCCC" stroke-width="0.5"/>

  <!-- Social button -->
  <rect x="76" y="504" width="248" height="36" rx="6" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="130" y="517" width="140" height="10" rx="2" fill="#CCCCCC"/>
  <text x="200" y="552" text-anchor="middle" font-size="9" fill="#999">Connexion via SSO / Google</text>

  <!-- Links -->
  <rect x="100" y="562" width="200" height="8" rx="2" fill="#DDDDDD"/>
  <text x="200" y="582" text-anchor="middle" font-size="9" fill="#AAAAAA">Mot de passe oublié · Créer un compte</text>

  <!-- Page label -->
  <text x="200" y="660" text-anchor="middle" font-size="10" fill="#BBBBBB">1 / 5 — Accueil / Connexion</text>
</svg>
