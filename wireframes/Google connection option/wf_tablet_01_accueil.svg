<svg viewBox="0 0 768 960" xmlns="http://www.w3.org/2000/svg" width="768" height="960" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe Tablette — Page 1 : Accueil / Connexion</title>
  <rect width="768" height="960" fill="#F0EDE6"/>
  <!-- Device frame -->
  <rect x="20" y="20" width="728" height="920" rx="16" fill="white" stroke="#BBBBBB" stroke-width="2"/>
  <!-- Topbar -->
  <rect x="20" y="20" width="728" height="56" rx="16" fill="#E8E4DC"/>
  <rect x="20" y="60" width="728" height="16" fill="#E8E4DC"/>
  <rect x="44" y="36" width="100" height="14" rx="3" fill="#AAAAAA"/>
  <rect x="628" y="34" width="100" height="24" rx="6" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="644" y="42" width="68" height="8" rx="2" fill="#CCCCCC"/>

  <!-- Hero — centré, plus large -->
  <rect x="44" y="96" width="680" height="200" rx="12" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="5,4"/>
  <circle cx="384" cy="148" r="34" fill="#CCCCCC"/>
  <rect x="244" y="192" width="280" height="14" rx="3" fill="#888"/>
  <rect x="184" y="214" width="400" height="10" rx="3" fill="#CCCCCC"/>
  <text x="384" y="268" text-anchor="middle" font-size="12" fill="#999">Slogan / description courte de l'application</text>

  <!-- Layout 2 colonnes : form gauche, infos droite -->
  <text x="44" y="330" font-size="11" fill="#999" letter-spacing="1.2">CONNEXION</text>

  <!-- Formulaire colonne gauche -->
  <rect x="44" y="344" width="340" height="340" rx="12" fill="white" stroke="#DDDDDD" stroke-width="0.5"/>
  <rect x="64" y="366" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="64" y="381" width="300" height="36" rx="8" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="64" y="428" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="64" y="443" width="300" height="36" rx="8" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="64" y="494" width="300" height="40" rx="8" fill="#333"/>
  <rect x="144" y="508" width="140" height="11" rx="2" fill="white"/>
  <text x="214" y="546" text-anchor="middle" font-size="10" fill="#999">Se connecter</text>
  <line x1="104" y1="564" x2="184" y2="564" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="214" y="567" text-anchor="middle" font-size="11" fill="#BBBBBB">ou</text>
  <line x1="244" y1="564" x2="324" y2="564" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="64" y="574" width="300" height="40" rx="8" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="124" y="589" width="180" height="10" rx="2" fill="#CCCCCC"/>
  <text x="214" y="624" text-anchor="middle" font-size="10" fill="#999">Connexion SSO / Google</text>
  <rect x="114" y="636" width="200" height="8" rx="2" fill="#DDDDDD"/>
  <text x="214" y="656" text-anchor="middle" font-size="10" fill="#AAAAAA">Mot de passe oublié · Créer un compte</text>

  <!-- Panneau droit : infos / avantages -->
  <rect x="408" y="344" width="316" height="340" rx="12" fill="#F0EDE6" stroke="#DDDDDD" stroke-width="0.5"/>
  <rect x="428" y="368" width="180" height="12" rx="3" fill="#888"/>
  <rect x="428" y="390" width="276" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="428" y="404" width="240" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="428" y="418" width="260" height="8" rx="2" fill="#CCCCCC"/>
  <!-- Picto features -->
  <rect x="428" y="444" width="28" height="28" rx="6" fill="#DDDDDD"/>
  <rect x="466" y="448" width="200" height="9" rx="2" fill="#AAAAAA"/>
  <rect x="466" y="462" width="160" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="428" y="484" width="28" height="28" rx="6" fill="#DDDDDD"/>
  <rect x="466" y="488" width="180" height="9" rx="2" fill="#AAAAAA"/>
  <rect x="466" y="502" width="140" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="428" y="524" width="28" height="28" rx="6" fill="#DDDDDD"/>
  <rect x="466" y="528" width="210" height="9" rx="2" fill="#AAAAAA"/>
  <rect x="466" y="542" width="170" height="7" rx="2" fill="#CCCCCC"/>

  <text x="384" y="940" text-anchor="middle" font-size="11" fill="#BBBBBB">Tablette — 1/5 · Accueil / Connexion</text>
</svg>
