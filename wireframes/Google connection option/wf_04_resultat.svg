<svg viewBox="0 0 400 900" xmlns="http://www.w3.org/2000/svg" width="400" height="900" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe — Page 4 : Résultat &amp; PDF</title>
  <desc>Page de résultat d'analyse avec scores, détails et rapport PDF automatique</desc>

  <rect width="400" height="900" fill="#F8F8F6"/>
  <rect x="20" y="20" width="360" height="860" rx="12" fill="white" stroke="#CCCCCC" stroke-width="1.5"/>

  <!-- Topbar -->
  <rect x="20" y="20" width="360" height="44" rx="12" fill="#F1EFE8"/>
  <rect x="20" y="52" width="360" height="12" fill="#F1EFE8"/>
  <polyline points="44,42 38,48 44,54" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="56" y="34" width="80" height="12" rx="3" fill="#AAAAAA"/>
  <rect x="316" y="32" width="50" height="24" rx="5" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="324" y="40" width="34" height="8" rx="2" fill="#CCCCCC"/>

  <!-- Result header card -->
  <rect x="36" y="80" width="328" height="76" rx="8" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="48" y="92" width="68" height="52" rx="4" fill="#DDDDDD"/>
  <!-- Meta lines -->
  <rect x="128" y="94" width="120" height="10" rx="2" fill="#888"/>
  <rect x="128" y="110" width="90" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="128" y="124" width="150" height="8" rx="2" fill="#CCCCCC"/>

  <!-- Section label résultat -->
  <text x="36" y="178" font-size="10" fill="#999" letter-spacing="1">RÉSULTAT DE L'ANALYSE</text>

  <!-- Badges -->
  <rect x="36" y="186" width="90" height="22" rx="11" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="50" y="196" width="62" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="136" y="186" width="110" height="22" rx="11" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="150" y="196" width="82" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="256" y="186" width="72" height="22" rx="11" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="270" y="196" width="44" height="7" rx="2" fill="#CCCCCC"/>

  <!-- Section scores -->
  <text x="36" y="232" font-size="10" fill="#999" letter-spacing="1">SCORES DE CONFIANCE</text>

  <!-- Score bar 1 -->
  <rect x="36" y="240" width="110" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="330" y="240" width="34" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="36" y="252" width="328" height="8" rx="4" fill="#EEEEEE"/>
  <rect x="36" y="252" width="280" height="8" rx="4" fill="#888"/>

  <!-- Score bar 2 -->
  <rect x="36" y="268" width="88" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="330" y="268" width="34" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="36" y="280" width="328" height="8" rx="4" fill="#EEEEEE"/>
  <rect x="36" y="280" width="204" height="8" rx="4" fill="#AAAAAA"/>

  <!-- Score bar 3 -->
  <rect x="36" y="296" width="130" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="330" y="296" width="34" height="7" rx="2" fill="#CCCCCC"/>
  <rect x="36" y="308" width="328" height="8" rx="4" fill="#EEEEEE"/>
  <rect x="36" y="308" width="135" height="8" rx="4" fill="#BBBBBB"/>

  <!-- Section détails -->
  <text x="36" y="338" font-size="10" fill="#999" letter-spacing="1">DÉTAILS &amp; OBSERVATIONS</text>

  <rect x="36" y="346" width="328" height="110" rx="8" fill="white" stroke="#EEEEEE" stroke-width="0.5"/>
  <rect x="48" y="360" width="304" height="9" rx="2" fill="#888"/>
  <rect x="48" y="376" width="288" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="48" y="390" width="270" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="48" y="404" width="295" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="48" y="418" width="240" height="8" rx="2" fill="#DDDDDD"/>

  <!-- PDF box -->
  <rect x="36" y="472" width="328" height="72" rx="8" fill="white" stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="4,3"/>
  <!-- PDF icon -->
  <rect x="52" y="484" width="28" height="36" rx="3" fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
  <text x="66" y="498" text-anchor="middle" font-size="8" fill="#AAAAAA">PDF</text>
  <rect x="54" y="507" width="24" height="6" rx="1" fill="#DDDDDD"/>
  <!-- PDF text -->
  <rect x="92" y="486" width="180" height="9" rx="2" fill="#888"/>
  <rect x="92" y="502" width="120" height="8" rx="2" fill="#CCCCCC"/>
  <!-- Download btn -->
  <rect x="300" y="488" width="52" height="28" rx="6" fill="#333"/>
  <rect x="308" y="498" width="36" height="8" rx="2" fill="white"/>
  <text x="200" y="556" text-anchor="middle" font-size="9" fill="#AAAAAA">Rapport PDF généré automatiquement · Télécharger</text>

  <!-- Action buttons -->
  <rect x="36" y="568" width="154" height="40" rx="8" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="76" y="582" width="74" height="10" rx="2" fill="#CCCCCC"/>
  <rect x="210" y="568" width="154" height="40" rx="8" fill="#333"/>
  <rect x="250" y="582" width="74" height="10" rx="2" fill="white"/>
  <text x="113" y="620" text-anchor="middle" font-size="9" fill="#AAA">Nouvelle analyse</text>
  <text x="287" y="620" text-anchor="middle" font-size="9" fill="#AAA">Voir l'historique</text>

  <text x="200" y="880" text-anchor="middle" font-size="10" fill="#BBBBBB">4 / 5 — Résultat &amp; PDF</text>
</svg>
