<svg viewBox="0 0 768 960" xmlns="http://www.w3.org/2000/svg" width="768" height="960" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe Tablette — Page 3 : Analyse d'image</title>
  <rect width="768" height="960" fill="#F0EDE6"/>
  <rect x="20" y="20" width="728" height="920" rx="16" fill="white" stroke="#BBBBBB" stroke-width="2"/>
  <!-- Topbar -->
  <rect x="20" y="20" width="728" height="56" rx="16" fill="#E8E4DC"/>
  <rect x="20" y="60" width="728" height="16" fill="#E8E4DC"/>
  <polyline points="50,46 44,52 50,58" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="64" y="36" width="100" height="14" rx="3" fill="#AAAAAA"/>
  <rect x="628" y="34" width="100" height="24" rx="6" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="644" y="42" width="68" height="8" rx="2" fill="#CCCCCC"/>

  <!-- Layout 2 colonnes : caméra gauche / formulaire droite -->
  <!-- Colonne gauche : capture -->
  <text x="44" y="100" font-size="11" fill="#999" letter-spacing="1.2">CAPTURE / IMPORT</text>
  <rect x="44" y="112" width="340" height="280" rx="12" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Camera icon -->
  <rect x="178" y="168" width="68" height="54" rx="8" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <circle cx="214" cy="195" r="17" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <circle cx="214" cy="195" r="7" fill="#CCCCCC"/>
  <rect x="154" y="238" width="120" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="134" y="253" width="160" height="8" rx="2" fill="#DDDDDD"/>
  <!-- Buttons -->
  <rect x="94" y="272" width="110" height="34" rx="8" fill="#333"/>
  <rect x="112" y="283" width="74" height="10" rx="2" fill="white"/>
  <rect x="224" y="272" width="110" height="34" rx="8" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="242" y="283" width="74" height="10" rx="2" fill="#CCCCCC"/>
  <text x="149" y="320" text-anchor="middle" font-size="9" fill="#AAA">Prendre une photo</text>
  <text x="279" y="320" text-anchor="middle" font-size="9" fill="#AAA">Importer un fichier</text>

  <!-- Preview zone -->
  <rect x="44" y="410" width="340" height="120" rx="12" fill="#E8E4DC" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="214" y="456" text-anchor="middle" font-size="11" fill="#AAAAAA">Aperçu de l'image</text>
  <rect x="134" y="466" width="160" height="8" rx="2" fill="#CCCCCC"/>
  <text x="214" y="512" text-anchor="middle" font-size="10" fill="#BBBBBB">Prévisualisation après capture</text>

  <!-- Colonne droite : formulaire -->
  <text x="410" y="100" font-size="11" fill="#999" letter-spacing="1.2">CONTEXTE <tspan fill="#BBBBBB" font-style="italic">(optionnel)</tspan></text>
  <rect x="410" y="112" width="314" height="418" rx="12" fill="white" stroke="#DDDDDD" stroke-width="0.5"/>
  <!-- Champs -->
  <rect x="426" y="132" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="426" y="147" width="282" height="34" rx="7" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="567" y="196" text-anchor="middle" font-size="9" fill="#AAA">Champ 1</text>

  <rect x="426" y="202" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="426" y="217" width="282" height="34" rx="7" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="567" y="266" text-anchor="middle" font-size="9" fill="#AAA">Champ 2</text>

  <rect x="426" y="272" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="426" y="287" width="282" height="34" rx="7" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="567" y="336" text-anchor="middle" font-size="9" fill="#AAA">Champ 3</text>

  <rect x="426" y="342" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="426" y="357" width="282" height="34" rx="7" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="567" y="406" text-anchor="middle" font-size="9" fill="#AAA">Champ 4</text>

  <rect x="426" y="412" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="426" y="427" width="282" height="34" rx="7" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="567" y="476" text-anchor="middle" font-size="9" fill="#AAA">Champ 5</text>

  <rect x="426" y="482" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <rect x="426" y="497" width="282" height="34" rx="7" fill="#F0EDE6" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="567" y="546" text-anchor="middle" font-size="9" fill="#AAA">Champ 6</text>

  <!-- CTA full width -->
  <rect x="44" y="556" width="680" height="50" rx="10" fill="#333"/>
  <rect x="284" y="572" width="200" height="14" rx="3" fill="white"/>
  <text x="384" y="618" text-anchor="middle" font-size="11" fill="#999">Lancer l'analyse</text>

  <text x="384" y="940" text-anchor="middle" font-size="11" fill="#BBBBBB">Tablette — 3/5 · Analyse d'image</text>
</svg>
