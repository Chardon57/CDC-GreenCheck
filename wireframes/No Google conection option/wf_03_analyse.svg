<svg viewBox="0 0 400 820" xmlns="http://www.w3.org/2000/svg" width="400" height="820" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe — Page 3 : Analyse d'image</title>
  <desc>Page de capture photo et formulaire de contexte optionnel</desc>

  <rect width="400" height="820" fill="#F8F8F6"/>
  <rect x="20" y="20" width="360" height="780" rx="12" fill="white" stroke="#CCCCCC" stroke-width="1.5"/>

  <!-- Topbar -->
  <rect x="20" y="20" width="360" height="44" rx="12" fill="#F1EFE8"/>
  <rect x="20" y="52" width="360" height="12" fill="#F1EFE8"/>
  <!-- Back arrow -->
  <polyline points="44,42 38,48 44,54" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="56" y="34" width="80" height="12" rx="3" fill="#AAAAAA"/>
  <rect x="316" y="32" width="50" height="24" rx="5" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="324" y="40" width="34" height="8" rx="2" fill="#CCCCCC"/>

  <!-- Section label -->
  <text x="36" y="90" font-size="10" fill="#999" letter-spacing="1">CAPTURE / IMPORT</text>

  <!-- Camera zone -->
  <rect x="36" y="100" width="328" height="200" rx="10" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Camera icon -->
  <rect x="172" y="138" width="56" height="44" rx="6" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <circle cx="200" cy="160" r="14" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <circle cx="200" cy="160" r="6" fill="#CCCCCC"/>
  <!-- Labels -->
  <rect x="150" y="194" width="100" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="130" y="208" width="140" height="7" rx="2" fill="#DDDDDD"/>
  <!-- Buttons -->
  <rect x="106" y="222" width="82" height="30" rx="6" fill="#555"/>
  <rect x="118" y="232" width="58" height="8" rx="2" fill="white"/>
  <rect x="212" y="222" width="82" height="30" rx="6" fill="white" stroke="#CCCCCC" stroke-width="0.5"/>
  <rect x="224" y="232" width="58" height="8" rx="2" fill="#CCCCCC"/>
  <text x="147" y="264" text-anchor="middle" font-size="9" fill="#AAA">Prendre une photo</text>
  <text x="253" y="264" text-anchor="middle" font-size="9" fill="#AAA">Importer un fichier</text>

  <!-- Divider -->
  <line x1="36" y1="318" x2="364" y2="318" stroke="#EEEEEE" stroke-width="0.5"/>

  <!-- Section label contexte -->
  <text x="36" y="338" font-size="10" fill="#999" letter-spacing="1">CONTEXTE  <tspan fill="#BBBBBB" font-style="italic">(optionnel)</tspan></text>

  <!-- Context subtitle -->
  <rect x="36" y="346" width="160" height="9" rx="2" fill="#CCCCCC"/>

  <!-- Row 1 : champs 1 & 2 -->
  <rect x="36" y="364" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="36" y="378" width="152" height="30" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="112" y="420" text-anchor="middle" font-size="9" fill="#AAAAAA">Champ 1</text>

  <rect x="212" y="364" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="212" y="378" width="152" height="30" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="288" y="420" text-anchor="middle" font-size="9" fill="#AAAAAA">Champ 2</text>

  <!-- Row 2 : champs 3 & 4 -->
  <rect x="36" y="430" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="36" y="444" width="152" height="30" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="112" y="486" text-anchor="middle" font-size="9" fill="#AAAAAA">Champ 3</text>

  <rect x="212" y="430" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="212" y="444" width="152" height="30" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="288" y="486" text-anchor="middle" font-size="9" fill="#AAAAAA">Champ 4</text>

  <!-- Row 3 : champs 5 & 6 -->
  <rect x="36" y="496" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="36" y="510" width="152" height="30" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="112" y="552" text-anchor="middle" font-size="9" fill="#AAAAAA">Champ 5</text>

  <rect x="212" y="496" width="60" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="212" y="510" width="152" height="30" rx="6" fill="#F1EFE8" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="288" y="552" text-anchor="middle" font-size="9" fill="#AAAAAA">Champ 6</text>

  <!-- CTA -->
  <rect x="36" y="572" width="328" height="44" rx="8" fill="#333"/>
  <rect x="140" y="588" width="120" height="12" rx="3" fill="white"/>
  <text x="200" y="628" text-anchor="middle" font-size="10" fill="#999">Lancer l'analyse</text>

  <text x="200" y="800" text-anchor="middle" font-size="10" fill="#BBBBBB">3 / 5 — Analyse d'image</text>
</svg>
