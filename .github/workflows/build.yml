name: build-and-push

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ---------------- BACKEND ----------------
      - name: Build backend image
        run: |
          docker build -t ghcr.io/${USERNAME}/flask-backend:latest ./backend
          docker push ghcr.io/${USERNAME}/flask-backend:latest

      # ---------------- FRONTEND ----------------
      - name: Build frontend image
        run: |
          docker build -t ghcr.io/${USERNAME}/react-frontend:latest ./frontend
          docker push ghcr.io/${USERNAME}/react-frontend:latest
